services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
POSTGRES_PASSWORD: <redacted>
      POSTGRES_DB: restaurantdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
DATABASE_URL: <redacted>
    depends_on:
      - db

volumes:
  pgdata:
